name: CI/CD - Build e deploy no Coolify

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Build do Angular
        run: npm run build

      - name: Validar a imagem Docker (mesmo Dockerfile usado pelo Coolify)
        run: docker build -t vi-nogueira:ci .
